name: Publicar Mestre CAD SketchUp 2021

on:
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'examples/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ruby 2.7 (compativel com SketchUp 2021)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'
      - name: Validar sintaxe e testes offline
        run: |
          ruby -c bridge/mestre_cad_2021.rb
          ruby -c bridge/mestre_cad_2021/core.rb
          ruby -c bridge/mestre_cad_2021/updater.rb
          ruby -c bridge/mestre_cad_2021/project_sync.rb
          ruby bridge/test_bridge.rb
          ruby bridge/test_updater.rb
          ruby bridge/test_project_sync.rb
          ruby bridge/test_skp_autosave.rb
      - name: Empacotar e validar RBZ
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(ruby -Ibridge -rmestre_cad_2021/updater -e 'print MestreCAD::SketchUp2021::Updater::VERSION')
          grep -Fq "ext.version = '$VERSION'" bridge/mestre_cad_2021.rb
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          (cd bridge && zip -qr "../dist/mestre-cad-bridge-2021-v$VERSION.rbz" mestre_cad_2021.rb mestre_cad_2021)
          FILE="dist/mestre-cad-bridge-2021-v$VERSION.rbz"
          unzip -t "$FILE"
          for required in mestre_cad_2021.rb mestre_cad_2021/core.rb mestre_cad_2021/updater.rb mestre_cad_2021/project_sync.rb mestre_cad_2021/exemplo-4x6.json; do
            unzip -Z -1 "$FILE" | grep -Fx "$required"
          done
          unzip -p "$FILE" mestre_cad_2021/exemplo-4x6.json | ruby -rjson -e 'd=JSON.parse(STDIN.read); abort "Exemplo invalido" unless d["schema"]=="mestre-cad-geometria-v1" && d["elementos"].length==6'
          sha256sum "$FILE"
      - name: Publicar GitHub Release somente para nova versao
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          ASSET="dist/mestre-cad-bridge-2021-v$VERSION.rbz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG ja existe; nao sobrescrever."
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "Mestre CAD SketchUp 2021 $TAG" --notes "v1.5.2: aumenta o limite de importacao para 260 elementos para suportar modulos solares detalhados com molduras e trilhos. Mantem atualizacao com preservacao de acabamentos por ID. Testes offline aprovados; validar no SketchUp 2021 antes de uso em producao."
          fi
