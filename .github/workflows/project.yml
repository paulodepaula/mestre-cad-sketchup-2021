name: Gerar arquivos CAD a partir do projeto

on:
  push:
    branches: [main]
    paths:
      - 'projects/**/model.json'
      - 'tools/build_project.py'
      - 'tools/tests/**'
      - '.github/workflows/project.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mestre-cad-project-main
  cancel-in-progress: false

jobs:
  gerar-arquivos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes dimensional e de formatos
        run: python -m unittest discover -s tools/tests -v
      - name: Gerar DXF e DAE
        run: python tools/build_project.py projects/obra-com-mezanino/model.json
      - name: Conferir os arquivos gerados
        run: python tools/build_project.py projects/obra-com-mezanino/model.json --check
      - name: Publicar arquivos na branch main
        shell: bash
        run: |
          set -euo pipefail
          git add -- projects/obra-com-mezanino/cadcraft/ \
                     projects/obra-com-mezanino/sketchup/modelo.dae \
                     projects/obra-com-mezanino/manifest.json
          if git diff --cached --quiet; then
            echo 'PASS: nenhum arquivo mudou.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(cad): atualizar DXF/DAE e manifesto do projeto'
          git push origin HEAD:main
